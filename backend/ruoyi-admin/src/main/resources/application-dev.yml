spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      p6spy: false
      primary: master
      strict: true
      datasource:
        master:
          type: ${spring.datasource.type}
          driverClassName: org.postgresql.Driver
          url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:framelean}?sslmode=${DB_SSL_MODE:disable}&reWriteBatchedInserts=true
          username: ${DB_USER:framelean}
          password: ${DB_PASSWORD:}
      hikari:
        maxPoolSize: ${DB_MAX_POOL_SIZE:20}
        minIdle: ${DB_MIN_IDLE:5}
        connectionTimeout: 30000
        validationTimeout: 5000
        idleTimeout: 600000
        maxLifetime: 1800000
        keepaliveTime: 30000

spring.data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
    timeout: 10s
    ssl.enabled: false

redisson:
  keyPrefix: framelean
  threads: 4
  nettyThreads: 8
  singleServerConfig:
    clientName: FrameLeanBackend
    connectionMinimumIdleSize: 4
    connectionPoolSize: 16
    idleConnectionTimeout: 10000
    timeout: 3000
    subscriptionConnectionPoolSize: 20

mail:
  enabled: false

sms:
  config-type: yaml
  restricted: true
  minute-max: 1
  account-max: 30
  blends: {}

justauth:
  address: http://localhost:4918
  type: {}
