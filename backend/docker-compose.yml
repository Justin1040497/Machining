name: framelean-backend

services:
  api:
    build: .
    ports:
      - "${APP_PORT:-4918}:4918"
    environment:
      - APP_PORT=4918
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=framelean
      - DB_USER=framelean
      - DB_PASSWORD=${DB_PASSWORD:-framelean}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SA_TOKEN_JWT_SECRET=${SA_TOKEN_JWT_SECRET:?SA_TOKEN_JWT_SECRET is required}
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - FRAMELEAN_API_KEY=${FRAMELEAN_API_KEY:-}
      - FRAMELEAN_PUBLIC_BASE_URL=${FRAMELEAN_PUBLIC_BASE_URL:?FRAMELEAN_PUBLIC_BASE_URL is required}
      - FRAMELEAN_ALLOWED_ORIGIN_PATTERNS=${FRAMELEAN_ALLOWED_ORIGIN_PATTERNS:-${FRAMELEAN_PUBLIC_BASE_URL}}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=framelean
      - POSTGRES_USER=framelean
      - POSTGRES_PASSWORD=${DB_PASSWORD:-framelean}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framelean"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping
          else
            redis-cli ping
          fi
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
