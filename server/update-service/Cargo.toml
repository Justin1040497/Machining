[package]
name = "framelean-update-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hmac = "0.12"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3"
