name: Build macOS Universal

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build macOS ${{ matrix.arch }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            output_label: arm64
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            output_label: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install autoconf automake libtool nasm pkg-config

      - name: Prepare Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build FFmpeg runtime
        run: scripts/build/build_ffmpeg_macos_arch.sh ${{ matrix.arch }}

      - name: Build QMC adapter
        run: scripts/build/build_qmc_decrypt_macos_arch.sh ${{ matrix.arch }}

      - name: Archive FFmpeg runtime slice
        run: tar -C third_party/ffmpeg/macos-${{ matrix.output_label }} -czf "$RUNNER_TEMP/framelean-ffmpeg-macos-${{ matrix.output_label }}.tar.gz" .

      - name: Upload FFmpeg runtime slice
        uses: actions/upload-artifact@v4
        with:
          name: framelean-ffmpeg-macos-${{ matrix.output_label }}
          path: ${{ runner.temp }}/framelean-ffmpeg-macos-${{ matrix.output_label }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Archive QMC adapter slice
        run: tar -C third_party/audio_adapters/qmc/macos-${{ matrix.output_label }} -czf "$RUNNER_TEMP/framelean-qmc-macos-${{ matrix.output_label }}.tar.gz" .

      - name: Upload QMC adapter slice
        uses: actions/upload-artifact@v4
        with:
          name: framelean-qmc-macos-${{ matrix.output_label }}
          path: ${{ runner.temp }}/framelean-qmc-macos-${{ matrix.output_label }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Universal 2 DMG
    needs: build-runtime
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Download arm64 FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: framelean-ffmpeg-macos-arm64
          path: ${{ runner.temp }}/framelean-runtime-slices/ffmpeg-arm64

      - name: Download x86_64 FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: framelean-ffmpeg-macos-x64
          path: ${{ runner.temp }}/framelean-runtime-slices/ffmpeg-x64

      - name: Download arm64 QMC adapter
        uses: actions/download-artifact@v4
        with:
          name: framelean-qmc-macos-arm64
          path: ${{ runner.temp }}/framelean-runtime-slices/qmc-arm64

      - name: Download x86_64 QMC adapter
        uses: actions/download-artifact@v4
        with:
          name: framelean-qmc-macos-x64
          path: ${{ runner.temp }}/framelean-runtime-slices/qmc-x64

      - name: Restore downloaded runtime slices
        run: |
          mkdir -p \
            third_party/ffmpeg/macos-arm64 \
            third_party/ffmpeg/macos-x64 \
            third_party/audio_adapters/qmc/macos-arm64 \
            third_party/audio_adapters/qmc/macos-x64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/ffmpeg-arm64/framelean-ffmpeg-macos-arm64.tar.gz" -C third_party/ffmpeg/macos-arm64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/ffmpeg-x64/framelean-ffmpeg-macos-x64.tar.gz" -C third_party/ffmpeg/macos-x64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/qmc-arm64/framelean-qmc-macos-arm64.tar.gz" -C third_party/audio_adapters/qmc/macos-arm64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/qmc-x64/framelean-qmc-macos-x64.tar.gz" -C third_party/audio_adapters/qmc/macos-x64

      - name: Merge Universal runtimes
        run: |
          scripts/build/build_ffmpeg_macos_universal.sh
          scripts/build/build_qmc_decrypt_macos_universal.sh

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install dmgbuild
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build Universal DMG
        run: scripts/release/build_dmg_macos.sh

      - name: Upload Universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-macos-universal
          path: build/macos/Build/Products/Release/FrameLean-v*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Attach Universal DMG to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/macos/Build/Products/Release/FrameLean-v*.dmg
