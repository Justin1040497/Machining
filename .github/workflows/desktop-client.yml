name: Desktop Client

on:
  workflow_dispatch:
    inputs:
      update_base_url:
        description: "FRAMELEAN_UPDATE_BASE_URL"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-runtime:
    name: Build macOS ${{ matrix.arch }} runtime
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            output_label: arm64
          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            output_label: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install autoconf automake libtool nasm pkg-config

      - name: Prepare Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build FFmpeg runtime
        run: scripts/build/build_ffmpeg_macos_arch.sh ${{ matrix.arch }}

      - name: Build QMC adapter
        run: scripts/build/build_qmc_decrypt_macos_arch.sh ${{ matrix.arch }}

      - name: Archive FFmpeg runtime slice
        run: tar -C build/dependencies/ffmpeg/macos-${{ matrix.output_label }} -czf "$RUNNER_TEMP/framelean-ffmpeg-macos-${{ matrix.output_label }}.tar.gz" .

      - name: Upload FFmpeg runtime slice
        uses: actions/upload-artifact@v4
        with:
          name: framelean-ffmpeg-macos-${{ matrix.output_label }}
          path: ${{ runner.temp }}/framelean-ffmpeg-macos-${{ matrix.output_label }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Archive QMC adapter slice
        run: tar -C build/dependencies/qmc/macos-${{ matrix.output_label }} -czf "$RUNNER_TEMP/framelean-qmc-macos-${{ matrix.output_label }}.tar.gz" .

      - name: Upload QMC adapter slice
        uses: actions/upload-artifact@v4
        with:
          name: framelean-qmc-macos-${{ matrix.output_label }}
          path: ${{ runner.temp }}/framelean-qmc-macos-${{ matrix.output_label }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  package:
    name: Package Universal 2 DMG
    needs: build-runtime
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Use CocoaPods for macOS plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Download arm64 FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: framelean-ffmpeg-macos-arm64
          path: ${{ runner.temp }}/framelean-runtime-slices/ffmpeg-arm64

      - name: Download x86_64 FFmpeg runtime
        uses: actions/download-artifact@v4
        with:
          name: framelean-ffmpeg-macos-x64
          path: ${{ runner.temp }}/framelean-runtime-slices/ffmpeg-x64

      - name: Download arm64 QMC adapter
        uses: actions/download-artifact@v4
        with:
          name: framelean-qmc-macos-arm64
          path: ${{ runner.temp }}/framelean-runtime-slices/qmc-arm64

      - name: Download x86_64 QMC adapter
        uses: actions/download-artifact@v4
        with:
          name: framelean-qmc-macos-x64
          path: ${{ runner.temp }}/framelean-runtime-slices/qmc-x64

      - name: Restore downloaded runtime slices
        run: |
          mkdir -p \
            build/dependencies/ffmpeg/macos-arm64 \
            build/dependencies/ffmpeg/macos-x64 \
            build/dependencies/qmc/macos-arm64 \
            build/dependencies/qmc/macos-x64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/ffmpeg-arm64/framelean-ffmpeg-macos-arm64.tar.gz" -C build/dependencies/ffmpeg/macos-arm64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/ffmpeg-x64/framelean-ffmpeg-macos-x64.tar.gz" -C build/dependencies/ffmpeg/macos-x64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/qmc-arm64/framelean-qmc-macos-arm64.tar.gz" -C build/dependencies/qmc/macos-arm64
          tar -xzf "$RUNNER_TEMP/framelean-runtime-slices/qmc-x64/framelean-qmc-macos-x64.tar.gz" -C build/dependencies/qmc/macos-x64

      - name: Merge Universal runtimes
        run: |
          scripts/build/build_ffmpeg_macos_universal.sh
          scripts/build/build_qmc_decrypt_macos_universal.sh

      - name: Install dmgbuild and Pillow
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild-venv"
          "$RUNNER_TEMP/dmgbuild-venv/bin/pip" install dmgbuild Pillow
          echo "$RUNNER_TEMP/dmgbuild-venv/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter dependencies
        run: flutter pub get
        working-directory: desktop-client

      - name: Validate macOS update settings
        env:
          FRAMELEAN_UPDATE_BASE_URL: ${{ github.event.inputs.update_base_url || vars.FRAMELEAN_UPDATE_BASE_URL }}
        run: |
          test -n "$FRAMELEAN_UPDATE_BASE_URL" || { echo "::error::Missing GitHub variable FRAMELEAN_UPDATE_BASE_URL"; exit 1; }
          case "$FRAMELEAN_UPDATE_BASE_URL" in
            https://*) ;;
            *) echo "::error::FRAMELEAN_UPDATE_BASE_URL must start with https://"; exit 1 ;;
          esac

      - name: Build Universal DMG
        env:
          FRAMELEAN_UPDATE_BASE_URL: ${{ github.event.inputs.update_base_url || vars.FRAMELEAN_UPDATE_BASE_URL }}
          FRAMELEAN_SPARKLE_FEED_URL: ${{ vars.FRAMELEAN_SPARKLE_FEED_URL }}
          FRAMELEAN_SPARKLE_PUBLIC_ED_KEY: ${{ vars.FRAMELEAN_SPARKLE_PUBLIC_ED_KEY }}
        run: scripts/release/build_dmg_macos.sh

      - name: Upload Universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-macos-universal
          path: |
            desktop-client/build/macos/Build/Products/Release/FrameLean-v*.dmg
            desktop-client/build/macos/Build/Products/Release/FrameLean-v*.dmg.update.json
          if-no-files-found: error
          retention-days: 14

      - name: Attach Universal DMG to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-client/build/macos/Build/Products/Release/FrameLean-v*.dmg
            desktop-client/build/macos/Build/Products/Release/FrameLean-v*.dmg.update.json

  build-windows:
    name: Build Windows release packages
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-binutils
            make
            file
            autoconf
            automake
            git
            curl
            tar

      - name: Build Windows FFmpeg from source
        shell: msys2 {0}
        run: bash scripts/build/build_ffmpeg_windows_x64.sh

      - name: Build Windows QMC adapter
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build\build_qmc_decrypt_windows.ps1

      - name: Show Flutter environment
        run: flutter doctor -v

      - name: Validate Windows update settings
        env:
          FRAMELEAN_UPDATE_BASE_URL: ${{ github.event.inputs.update_base_url || vars.FRAMELEAN_UPDATE_BASE_URL }}
          FRAMELEAN_RELEASE_KEY_ID: ${{ vars.FRAMELEAN_RELEASE_KEY_ID }}
          FRAMELEAN_RELEASE_PUBLIC_KEY: ${{ vars.FRAMELEAN_RELEASE_PUBLIC_KEY }}
          FRAMELEAN_RELEASE_PRIVATE_KEY: ${{ secrets.FRAMELEAN_RELEASE_PRIVATE_KEY }}
        run: |
          foreach ($name in @(
            "FRAMELEAN_UPDATE_BASE_URL",
            "FRAMELEAN_RELEASE_KEY_ID",
            "FRAMELEAN_RELEASE_PUBLIC_KEY",
            "FRAMELEAN_RELEASE_PRIVATE_KEY"
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Missing GitHub variable or secret: $name"
            }
          }

      - name: Write Windows update private key
        env:
          FRAMELEAN_RELEASE_PRIVATE_KEY: ${{ secrets.FRAMELEAN_RELEASE_PRIVATE_KEY }}
        run: |
          $privateKeyPath = Join-Path $env:RUNNER_TEMP "framelean-release-private-key.txt"
          Set-Content -LiteralPath $privateKeyPath -Value $env:FRAMELEAN_RELEASE_PRIVATE_KEY -NoNewline -Encoding utf8
          "FRAMELEAN_RELEASE_PRIVATE_KEY_FILE=$privateKeyPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows zip and installer
        env:
          FRAMELEAN_UPDATE_BASE_URL: ${{ github.event.inputs.update_base_url || vars.FRAMELEAN_UPDATE_BASE_URL }}
          FRAMELEAN_RELEASE_KEY_ID: ${{ vars.FRAMELEAN_RELEASE_KEY_ID }}
          FRAMELEAN_RELEASE_PUBLIC_KEY: ${{ vars.FRAMELEAN_RELEASE_PUBLIC_KEY }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\build_windows.ps1

      - name: Upload Windows portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-windows-x64-portable
          path: desktop-client/build/windows/x64/runner/FrameLean-v*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-windows-x64-installer
          path: desktop-client/build/windows/x64/installer/FrameLean-v*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Windows update metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameLean-windows-x64-update-json
          path: desktop-client/build/windows/x64/installer/FrameLean-v*-windows-x64-setup.exe.update.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Attach Windows packages to tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop-client/build/windows/x64/runner/FrameLean-v*-windows-x64.zip
            desktop-client/build/windows/x64/installer/FrameLean-v*-windows-x64-setup.exe
