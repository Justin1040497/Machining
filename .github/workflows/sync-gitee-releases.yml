name: Sync Gitee Releases

on:
  workflow_dispatch:
    inputs:
      confirm_overwrite:
        description: "Delete all Gitee releases first, then recreate them from GitHub releases"
        required: true
        type: boolean
        default: false
      dry_run:
        description: "Preview the sync without changing Gitee"
        required: true
        type: boolean
        default: false
      include_drafts:
        description: "Publish GitHub draft releases to Gitee as normal releases"
        required: true
        type: boolean
        default: false
      gitee_owner:
        description: "Gitee owner path"
        required: true
        type: string
        default: zhouycheng
      gitee_repo:
        description: "Gitee repository path"
        required: true
        type: string
        default: FrameLean
      default_target_commitish:
        description: "Fallback target commitish when a GitHub release has none"
        required: true
        type: string
        default: main

permissions:
  contents: read

jobs:
  sync-gitee-releases:
    name: Sync GitHub releases to Gitee
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require overwrite confirmation
        if: ${{ inputs.dry_run != true && inputs.confirm_overwrite != true }}
        run: |
          echo "This workflow deletes all existing Gitee releases before syncing."
          echo "Re-run it with confirm_overwrite checked."
          exit 1

      - name: Sync releases
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          args=(
            --github-repo "${GITHUB_REPOSITORY}"
            --gitee-owner "${{ inputs.gitee_owner }}"
            --gitee-repo "${{ inputs.gitee_repo }}"
            --default-target-commitish "${{ inputs.default_target_commitish }}"
            --overwrite
          )

          if [[ "${{ inputs.confirm_overwrite }}" == "true" ]]; then
            args+=(--confirm-overwrite)
          fi

          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi

          if [[ "${{ inputs.include_drafts }}" == "true" ]]; then
            args+=(--include-drafts)
          fi

          python3 scripts/sync_gitee_releases.py "${args[@]}"
