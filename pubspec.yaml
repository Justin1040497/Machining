name: framelean
description: FrameLean is a local desktop media compression app.
publish_to: 'none'

version: 1.2.1+8

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  uuid: ^4.5.3
  drift: ^2.34.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  args: ^2.7.0
  file_selector: ^1.1.0
  file_picker: ^11.0.2
  desktop_drop: ^0.7.1
  flutter_animate: ^4.5.2
  flutter_screenutil: ^5.9.3
  pointycastle: ^4.0.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  audioplayers: ^6.8.1
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  flutter_markdown_plus: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  sqlite3: ^3.3.4
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  dmg: ^0.1.8

flutter_launcher_icons:
  image_path: assets/app_icon/light.png
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

flutter:
  config:
    # 因 Flutter 的新版本要求 后续这里需要修改为 True
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/app_icon/
    - assets/icons/
    - assets/sounds/

  fonts:
    - family: AlibabaPuHuiTi
      fonts:
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-55-Regular.ttf
          weight: 400
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-65-Medium.ttf
          weight: 500
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-75-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/alibaba_puhuiti/AlibabaPuHuiTi-3-85-Bold.ttf
          weight: 700
