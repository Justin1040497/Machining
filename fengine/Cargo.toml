[package]
name = "framelean-engine"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "framelean-engine"
path = "src/main.rs"

[dependencies]
framelean-core = { path = "../fll/crates/framelean-core" }
framelean-media = { path = "../fll/crates/framelean-media" }
framelean-plugin = { path = "../fll/crates/framelean-plugin" }
framelean-runtime = { path = "../fll/crates/framelean-runtime" }
framelean-analysis = { path = "../fll/crates/framelean-analysis" }
framelean-environment = { path = "../fll/crates/framelean-environment" }
framelean-ffmpeg = { path = "../fll/crates/framelean-ffmpeg" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
